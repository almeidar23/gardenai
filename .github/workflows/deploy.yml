name: Deploy to Bluehost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via cPanel Git
        run: |
          curl -s "https://7ire.com:2083/execute/VersionControl/update" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home3/sevireco/public_html/gardenai"

          curl -s "https://7ire.com:2083/execute/VersionControl/retrieve_deploy_status" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository=/home3/sevireco/public_html/gardenai"
