<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="GardenAI - Gestión inteligente de tu jardín con análisis por IA. Monitorea tus macetas, detecta plagas y lee tu analizador de suelo.">
  <meta name="theme-color" content="#0a0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GardenAI">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='48' font-size='52' text-anchor='middle'%3E🌱%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">
  <link rel="stylesheet" href="./css/styles.css">
  <title>GardenAI — Jardín Inteligente</title>
  <script>
    // Apply saved theme instantly before first paint — eliminates black flash
    (function() {
      var t = localStorage.getItem('gardenai-theme');
      if (t === 'botanical' || t === 'tropical') {
        document.documentElement.setAttribute('data-theme', t);
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <a href="#home" class="header-logo" data-navigate="home">
        <span class="logo-icon">🌱</span>
        <span class="logo-text">GardenAI</span>
      </a>
      <div class="header-title" id="header-title"></div>
      <div class="header-right">
        <span class="app-version">v5.6.0</span>
        <button class="header-settings-btn" data-nav="settings" id="nav-settings" title="Ajustes">⚙️</button>
      </div>
    </header>

    <!-- Main content area -->
    <main class="app-main" id="main-content">
      <!-- Rendered by JS -->
    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-nav="home" id="nav-home">
        <span class="nav-icon">🏠</span>
        Inicio
      </button>
      <button class="nav-item" data-nav="tasks" id="nav-tasks">
        <span class="nav-icon">📋</span>
        Tareas
      </button>
      <button class="nav-item" data-nav="products" id="nav-products">
        <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 3h6v2H9V3zm1 2v5l-5 8.5c-.4.7.1 1.5.9 1.5h12.2c.8 0 1.3-.8.9-1.5L14 10V5h-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/><rect x="8" y="2.5" width="8" height="2" rx="0.5" stroke="currentColor" stroke-width="1.5" fill="none"/><ellipse cx="12" cy="16" rx="3.5" ry="1.5" fill="currentColor" opacity="0.25"/></svg></span>
        Productos
      </button>
      <button class="nav-item" data-nav="stats" id="nav-stats">
        <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="10" width="5" height="11" rx="1.5" fill="#ef4444"/><rect x="8.5" y="5" width="5" height="16" rx="1.5" fill="#22c55e"/><rect x="16" y="1" width="5" height="20" rx="1.5" fill="#3b82f6"/></svg></span>
        Stats
      </button>
    </nav>

    <!-- Modals container -->
    <div id="modals"></div>

    <!-- Toast container -->
    <div id="app-toast" class="toast"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
